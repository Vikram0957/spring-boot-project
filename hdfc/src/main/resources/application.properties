spring.application.name=hdfc
spring.datasource.url=jdbc:mysql://localhost:3307/mydb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# A strong Base64-encoded secret key (minimum 256-bit for HS256)
jwt.secret=YWFhYmJiY2NjZGRkZWVlZmZmMTExMjIyMzMzNDQ0NTU2Njc3ODg5OTAw

# Token validity time in milliseconds (e.g., 1 hour)
jwt.expiration=3600000
