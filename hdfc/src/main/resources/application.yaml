spring:
  application:
    name: hdfc
  datasource:
    url: jdbc:mysql://localhost:3307/mydb?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
server:
  port: 8080
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
jwt:
  secret: YWFhYmJiY2NjZGRkZWVlZmZmMTExMjIyMzMzNDQ0NTU2Njc3ODg5OTAw
  expiration: 86400000
  refresh-expiration: 604800000
management:
  endpoints:
    web:
      exposure:
        include: "*"
