spring:
  application:
    name: hdfc
  datasource:
    url: jdbc:mysql://localhost:3307/spring_security?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
      order_inserts: true
      generate_statistics: true
      jdbc:
        batch_size: 1000
    show-sql: false
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
server:
  port: 8080
jwt:
  secret: YWFhYmJiY2NjZGRkZWVlZmZmMTExMjIyMzMzNDQ0NTU2Njc3ODg5OTAw
  expiration: 86400000
  refresh-expiration: 604800000
management:
  endpoints:
    web:
      exposure:
        include: "*"
